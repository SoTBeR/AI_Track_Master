[package]
name = "aitm-server"
description = "MCP server of AI Track Master (experimental probe tools, task M0-09)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
